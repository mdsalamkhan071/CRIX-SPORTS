
name: Build CRIX SPORTS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Main Dart File
        run: test -f lib/main.dart

      - name: Create Android Project
        run: flutter create --project-name crix_sports --platforms=android --org com.crixsports .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload CRIX SPORTS APK
        uses: actions/upload-artifact@v4
        with:
          name: CRIX-SPORTS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
